name: Windows .exe derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testleri calistir (demo goruntuler)
        run: python -m pytest tests -q

      - name: PyInstaller ile derle
        run: >
          pyinstaller baslat.py --name TrikoKontrol --noconfirm --windowed --onedir
          --collect-all mediapipe
          --add-data "models;models"

      - name: Paketi hazirla
        shell: pwsh
        run: |
          Copy-Item windows_acilista_baslat.bat dist/TrikoKontrol/
          Copy-Item README.md dist/TrikoKontrol/BENIOKU.md
          Compress-Archive -Path dist/TrikoKontrol -DestinationPath TrikoKontrol-Windows.zip

      - name: Duman testi (exe tek resimle calisiyor mu)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/TrikoKontrol/TrikoKontrol.exe -ArgumentList '--resim','demo/girdiler/poz_01_isaret_parmagi_biyik_sol.jpg','--cikti','smoke.jpg' -Wait -PassThru
          if (-not (Test-Path smoke.jpg)) { throw "exe calismadi (cikis kodu $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: TrikoKontrol-Windows
          path: TrikoKontrol-Windows.zip

      - name: Indirme sayfasina yukle (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-son
          name: TrikoKontrol - Windows (son surum)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: TrikoKontrol-Windows.zip
          body: |
            Windows icin hazir paket. ZIP'i indirin, bir klasore cikartin ve TrikoKontrol.exe'yi calistirin.
            Python kurmaniza gerek yoktur.
